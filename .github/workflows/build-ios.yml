
name: Build iOS with Flet

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Compilar aplicación iOS
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          working-directory: .
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: flet-ipa
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
